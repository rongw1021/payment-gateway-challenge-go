          schema:
            $ref: '#/definitions/models.ProblemDetails'
      security:
      - ApiKey: []
      summary: Confirm a payment intent using a single-use card token.
      tags:
      - Payment intents
  /ping:
    get:
      description: |-
        - **Authentication:** Public endpoint; no API key is required.
        - **Rate limit:** Exempt from the global rate limit.
      operationId: ping
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pong'
      summary: Check gateway liveness.
      tags:
      - Health
securityDefinitions:
  ApiKey:
    description: Enter the full `Bearer sk_<payload>` value. This is an **API key**,
      not JWT or HTTP Basic authentication.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
