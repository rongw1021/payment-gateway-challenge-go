      summary: Create a payment intent without submitting a payment to the bank.
      tags:
      - Payment intents
  /api/PaymentIntents/{paymentIntentId}:
    get:
      description: |-
        **Required scope:** `payment-intents:read`

        ### Response
        - Return **200 OK** with the merchant-owned intent's current state and complete transaction history, **oldest first**.
        - A new intent has an empty transaction history.
        - Malformed, missing, or foreign intent IDs return **404 Not Found**.
      operationId: getPaymentIntent
      parameters:
      - description: Payment intent UUID
        format: uuid
        in: path
        name: paymentIntentId
        required: true
        type: string
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: no-store
              type: string
            Pragma:
              description: no-cache
              type: string
            X-Request-Id:
              description: Server-generated request UUIDv7 when available
              type: string
          schema:
            $ref: '#/definitions/models.PaymentIntentResponse'
        "401":
          description: Unauthorized
          headers:
            Cache-Control:
              description: no-store
              type: string
            Pragma:
              description: no-cache
              type: string
            WWW-Authenticate:
              description: Bearer
              type: string
            X-Request-Id:
              description: Server-generated request UUIDv7 when available
              type: string
          schema:
