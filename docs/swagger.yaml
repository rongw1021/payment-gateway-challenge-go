  /api/PaymentIntents/{paymentIntentId}/confirm:
    post:
      consumes:
      - application/json
      description: |-
        **Required scope:** `payment-intents:confirm`

        ### New attempts
        - Allowed only when the intent is `Created` or `Declined`.
        - Consume a merchant-owned, single-use card token.

        ### Idempotent replay
        - Reuse the same idempotency key, intent, and card token, even after token expiry.
        - Matching replays reuse the attempt and follow the **current intent state**, not a cached original response.

        ### Response states
        - **200 OK:** `Authorized` or `Declined`, with the complete transaction history.
        - **202 Accepted:** `PendingVerification`, with complete history and a `Location` lookup URL.
        - **409 Conflict:** The attempt is still `Processing`, the intent cannot start another attempt, or the idempotency key conflicts.

        > **Pending verification:** A `202` response is not an authorization or a decline and does not guarantee eventual verification or success.
        > **Do not retry with a new idempotency key.** Use the `Location` URL to retrieve the current intent.
      operationId: confirmPaymentIntent
      parameters:
      - description: Payment intent UUID
        format: uuid
        in: path
        name: paymentIntentId
        required: true
        type: string
      - description: Lowercase hyphenated GUID (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)
        format: uuid
        in: header
        maxLength: 36
        minLength: 36
        name: X-Idempotency-Key
        required: true
        type: string
      - description: Single-use card token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ConfirmPaymentIntentRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: Authorized or Declined intent with its complete transaction
            history
          headers:
            Cache-Control:
              description: no-store
              type: string
            Pragma:
              description: no-cache
              type: string
            X-Request-Id:
              description: Server-generated request UUIDv7 when available
              type: string
          schema:
            $ref: '#/definitions/models.PaymentIntentResponse'
        "202":
          description: Accepted confirmation with an unconfirmed bank outcome and
            complete transaction history
          headers:
            Cache-Control:
              description: no-store
              type: string
            Location:
              description: Relative payment-intent lookup URL, also returned on pending-verification
                replay
              type: string
            Pragma:
              description: no-cache
              type: string
            X-Request-Id:
              description: Server-generated request UUIDv7 when available
              type: string
          schema:
            $ref: '#/definitions/models.PaymentIntentResponse'
        "400":
          description: Invalid request/key or invalid, expired, consumed, or foreign
            card token
          headers:
            Cache-Control:
              description: no-store
              type: string
            Pragma:
              description: no-cache
              type: string
            X-Request-Id:
              description: Server-generated request UUIDv7 when available
              type: string
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "401":
          description: Unauthorized
          headers:
            Cache-Control:
              description: no-store
              type: string
            Pragma:
              description: no-cache
              type: string
            WWW-Authenticate:
              description: Bearer
              type: string
            X-Request-Id:
              description: Server-generated request UUIDv7 when available
              type: string
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "403":
          description: Forbidden
          headers:
            Cache-Control:
              description: no-store
              type: string
            Pragma:
              description: no-cache
              type: string
            X-Request-Id:
              description: Server-generated request UUIDv7 when available
              type: string
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "404":
          description: Intent ID is malformed, missing, or owned by another merchant
          headers:
            Cache-Control:
              description: no-store
              type: string
            Pragma:
              description: no-cache
              type: string
            X-Request-Id:
