services:
  payment_gateway:
    build:
      context: .
    environment:
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:8090:8090"
    configs:
      - source: gateway_config
        target: /app/config.development.yaml
    depends_on:
      bank_simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    stop_grace_period: 15s

  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:2525/imposters/8080', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

configs:
  gateway_config:
    file: ./config.development.yaml