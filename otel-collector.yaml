receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  elasticsearch:
    endpoint: http://elasticsearch:9200
    timeout: 5s
    mapping:
      mode: otel
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 2
      batch:
        flush_timeout: 1s
        min_size: 1
        max_size: 512
        sizer: items

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [elasticsearch]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [elasticsearch]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [elasticsearch]
