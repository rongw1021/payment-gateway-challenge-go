services:
  payment_gateway:
    environment:
      OBSERVABILITY: "true"
    depends_on:
      otel_collector:
        condition: service_started

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  otel_collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 256m

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_ENABLED: "false"
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:5601:5601"
    mem_limit: 2g

  kibana_setup:
    image: docker.elastic.co/kibana/kibana:9.5.6
    entrypoint: ["/usr/share/kibana/node/default/bin/node", "/setup/setup.mjs"]
    environment:
      KIBANA_URL: "http://kibana:5601"
    depends_on:
      - kibana
    volumes:
      - ./kibana:/setup:ro
    read_only: true
    mem_limit: 128m
    restart: "no"

volumes:
  elasticsearch-data:
